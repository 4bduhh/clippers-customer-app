<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eab40c"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Layam Clippers"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Layam Clippers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@700;800&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
    :root{--bg:#F4F6FA;--ink:#15171C;--mut:#7B8494;--y:#FFD21F;--y2:#FFB800;--sh:#C8CEDA;--hi:#fff;--r:22px}
    *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
    html{scroll-padding-top:90px}
    body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
    /* soft yellow light behind the glass */
    body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(420px 420px at 8% 4%,#FFE27A88,transparent 70%),radial-gradient(380px 380px at 100% 38%,#FFD21F55,transparent 70%),radial-gradient(420px 420px at 0% 100%,#FFC40044,transparent 70%)}
    h1,h2,h3{font-family:'Barlow Condensed',Impact,sans-serif;font-weight:800;letter-spacing:.2px}
    h1,h2{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;letter-spacing:.4px;color:var(--ink);text-shadow:0 2px 0 #fff,3px 6px 10px #b9c0cf}
    h1{font-size:31px;line-height:1.12}h2{font-size:25px;line-height:1.15}h3{font-size:24px}
    small{color:var(--mut);font-weight:500}
    .glass{background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);border:1px solid rgba(255,255,255,.85);box-shadow:0 10px 34px rgba(20,23,28,.09)}
    .neo{background:var(--bg);border-radius:var(--r);box-shadow:9px 9px 20px var(--sh),-9px -9px 20px var(--hi)}
    .inset{box-shadow:inset 5px 5px 11px var(--sh),inset -5px -5px 11px var(--hi)}
    header{position:relative;z-index:5;padding:calc(8px + env(safe-area-inset-top)) 16px 16px;text-align:center;color:var(--ink);background:radial-gradient(120% 90% at 20% 0%,#f7cf45 0%,#eab40c 55%,#d6a006 100%);border-radius:0 0 50% 50%/0 0 30px 30px;box-shadow:0 10px 22px #b8890a55,inset 0 -6px 14px #fff3}
    header::after{content:"";position:absolute;left:50%;bottom:-14px;width:72%;height:28px;transform:translateX(-50%);background:#eab40c33;filter:blur(12px);border-radius:50%;z-index:-1}
    .lg{width:100px;height:106px;margin:0 auto;display:grid;place-items:center;filter:drop-shadow(0 8px 10px #7a560666)}
    .lg img{width:100%;height:100%;object-fit:contain;display:block}
    header small{display:none}
    header b{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;line-height:1}
    header small{display:block;font-size:12px}
    main{padding:22px 16px 24px;max-width:520px;margin:auto}
    .card{padding:20px;margin:14px 0}
    .hero{padding:26px 20px;text-align:center;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
    .plate{border-radius:28px;padding:14px;margin-bottom:18px;background:linear-gradient(160deg,#fff,#EEF1F6)}
    .plate img{display:block;width:100%;max-height:230px;object-fit:contain}
    .card{border-radius:34px}
    .hero{border:0;border-radius:44px;position:relative;overflow:hidden;background:linear-gradient(145deg,#fff,#EDF0F6);box-shadow:20px 20px 44px #c3c9d6,-16px -16px 36px #fff,inset 0 0 0 2px #fff}
    .hero>*{position:relative;z-index:1}
    .hero h1{font-size:31px}
    .fld{position:relative;margin:12px 0}
    .fld input{margin:0;padding-left:68px;border-radius:24px;min-height:60px}
    .fld i{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 30% 24%,#fff 0%,rgba(255,255,255,.55) 38%,rgba(185,194,212,.6) 100%);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1.5px solid #fff;box-shadow:6px 6px 13px #bfc6d4,-5px -5px 11px #fff,inset -4px -5px 9px rgba(140,152,176,.45),inset 3px 3px 6px #fff}
    .fld i::after{content:"";position:absolute;top:4px;left:8px;width:16px;height:8px;border-radius:50%;background:linear-gradient(#fffd,#fff0);transform:rotate(-25deg)}
    .fld i svg{width:20px;height:20px}
    .hero button#go{border-radius:24px;min-height:58px;margin-top:16px;font-size:17px;box-shadow:8px 8px 18px #d9b02c88,-6px -6px 14px #fff,0 10px 24px #FFD21F66}
    .hero p{color:var(--mut);margin:8px 0 18px;font-weight:500}
    @keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
    input{width:100%;padding:16px 18px;border-radius:16px;border:0;background:var(--bg);color:var(--ink);font:600 16px Manrope,sans-serif;margin:7px 0;outline:0;box-shadow:inset 5px 5px 11px var(--sh),inset -5px -5px 11px var(--hi);transition:box-shadow .2s}
    input:focus{box-shadow:inset 5px 5px 11px var(--sh),inset -5px -5px 11px var(--hi),0 0 0 2px var(--y)}
    input::placeholder{color:#A3ABB9;font-weight:500}
    button{width:100%;min-height:52px;border:0;border-radius:16px;font:800 16px Manrope,sans-serif;color:var(--ink);cursor:pointer;margin-top:8px;background:linear-gradient(145deg,#FFE04D,#FFC400);box-shadow:6px 6px 14px #d9b02c77,-5px -5px 12px #fff;transition:transform .15s,box-shadow .15s}
    button:active{transform:scale(.98);box-shadow:inset 4px 4px 9px #d9a90088,inset -3px -3px 8px #fff9}
    button.s{background:var(--bg);box-shadow:6px 6px 14px var(--sh),-6px -6px 14px var(--hi)}
    button.s:active{box-shadow:inset 4px 4px 9px var(--sh),inset -4px -4px 9px var(--hi)}
    button:focus-visible,.sv:focus-visible,.ch:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
    .hi{margin:6px 4px 14px}.hi small{font-size:15px}
    .sv{display:flex;align-items:center;gap:14px;padding:16px;margin:14px 2px;cursor:pointer;transition:box-shadow .2s}
    .sv .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:18px;color:transparent;box-shadow:inset 3px 3px 7px var(--sh),inset -3px -3px 7px var(--hi);transition:all .2s}
    .sv .t{flex:1;font-weight:800}.sv .t small{display:block;margin-top:2px}
    .sv b{font-family:'Barlow Condensed',sans-serif;font-size:24px}
    .sv.on{box-shadow:inset 5px 5px 11px var(--sh),inset -5px -5px 11px var(--hi);background:linear-gradient(145deg,#FFF6CC,#FFEFA8)}
    .sv.on .ic{background:var(--y);color:var(--ink);box-shadow:3px 3px 8px #d9b02c88,-2px -2px 6px #fff}
    .lbl{font-weight:800;margin:20px 4px 6px;font-size:15px}
    .chips{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 2px}
    .ch{min-height:44px;margin:0;padding:0 4px;font-size:13px;font-weight:700;background:var(--bg);box-shadow:4px 4px 9px var(--sh),-4px -4px 9px var(--hi);border-radius:13px}
    .ch.on{background:var(--ink);color:#fff;box-shadow:inset 3px 3px 7px #000a,inset -2px -2px 6px #444}
    .ch:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
    .bar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));margin-top:22px;padding:10px 10px 10px 20px;border-radius:24px;display:flex;align-items:center;gap:14px}
    .bar div{line-height:1.1}.bar b{font-family:'Barlow Condensed',sans-serif;font-size:30px;display:block}
    .bar button{flex:1;margin:0}
    .done{text-align:center;padding:34px 20px}
    .tick{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;font-size:38px;background:linear-gradient(145deg,#FFE04D,#FFC400);box-shadow:8px 8px 18px #d9b02c77,-6px -6px 14px #fff}
    .bk{padding:18px;margin:16px 2px}
    .bk .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .pill{display:inline-block;padding:5px 12px;border-radius:99px;font-size:12px;font-weight:800;background:var(--bg);box-shadow:inset 2px 2px 5px var(--sh),inset -2px -2px 5px var(--hi)}
    .pill.ok{background:#DDF7E6;color:#0E7A3A}
    .bk p.by,.c p.by{display:inline-block;margin-top:8px!important;padding:5px 12px;border-radius:99px;background:#FFF4C2;color:#6B4300;font-size:13px}.by b{font-weight:800}
    .amt{font-family:'Barlow Condensed',sans-serif;font-size:30px;margin-top:8px}
    .bk p{color:var(--mut);margin-top:4px;font-weight:500}
    a{color:var(--ink);font-weight:800;text-decoration-color:var(--y);text-decoration-thickness:3px;text-underline-offset:3px}
    .seg{display:flex;gap:6px;padding:6px;border-radius:20px;background:var(--bg);box-shadow:inset 3px 3px 7px var(--sh),inset -3px -3px 7px var(--hi);margin:0 0 16px}
    .seg button{flex:1;margin:0;min-height:42px;border-radius:15px;background:transparent;box-shadow:none;color:var(--mut);font-weight:800}
    .seg button.on{background:var(--ink);color:var(--y);box-shadow:3px 3px 8px var(--sh)}
    #lg{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:6;width:auto;min-height:0;height:44px;margin:0;padding:0 18px 0 5px;display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.22);border-radius:99px;background:linear-gradient(160deg,#2b2f39 0%,#15171C 55%,#0b0c0f 100%);color:#fff;font:800 14px Manrope,sans-serif;letter-spacing:.3px;cursor:pointer;overflow:hidden;box-shadow:0 10px 22px rgba(20,23,28,.38),0 2px 0 rgba(255,255,255,.35),inset 0 1.5px 1px rgba(255,255,255,.28),inset 0 -3px 6px rgba(0,0,0,.5);transition:transform .2s,box-shadow .2s}
    #lg::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-20deg);animation:shine 3.6s ease-in-out infinite}
    @keyframes shine{0%,60%{left:-60%}100%{left:130%}}
    #lg i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#FFF1A6,#FFD21F 55%,#E8A800);color:var(--ink);box-shadow:0 3px 8px rgba(255,196,0,.55),inset 0 1px 1px #fff9,inset 0 -2px 4px rgba(150,95,0,.35);transition:transform .25s}
    #lg svg{width:17px;height:17px}
    header{transition:padding .25s}header.has-lg{padding-top:calc(62px + env(safe-area-inset-top))}
    #lg[hidden]{display:none}
    #lg:hover i{transform:translateX(2px)}
    #lg:active{transform:scale(.95);box-shadow:0 5px 12px rgba(20,23,28,.4),inset 0 2px 5px rgba(0,0,0,.6)}
    .foot{text-align:center;margin:34px 0 10px;font-size:14px}
    #ov{position:fixed;inset:0;background:rgba(244,246,250,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:none;place-items:center;text-align:center;z-index:9}
    #qb{max-height:88vh;overflow:auto}
    #ov>div{width:min(88vw,360px);padding:24px;border-radius:30px;animation:rise .3s both}
    #ov img{width:100%;background:#fff;padding:12px;border-radius:20px;box-shadow:inset 3px 3px 8px var(--sh),inset -3px -3px 8px var(--hi)}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
    </style></head><body>

    function welcome(){lgb(0);app.innerHTML=`<div class="glass card hero"><h1>Fresh cut, zero waiting</h1><p>Tell us who you are once. Booking takes under a minute.</p><div class="fld"><i><svg viewBox="0 0 24 24" fill="none" stroke="#15171C" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></i><input id="n" placeholder="Your name" autocomplete="name"></div><div class="fld"><i><svg viewBox="0 0 24 24" fill="none" stroke="#15171C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></i><input id="p" type="tel" inputmode="numeric" placeholder="WhatsApp number" maxlength="10" autocomplete="tel"></div><button id="go">Continue</button></div>`;
    const isM=()=>$('#n').value.includes('@');
    const sync=()=>{const m=isM(),p=$('#p');p.type=m?'password':'tel';p.placeholder=m?'Password':'WhatsApp number';p.inputMode=m?'text':'numeric';p.autocomplete=m?'current-password':'tel';m?p.removeAttribute('maxlength'):p.setAttribute('maxlength','10');$('#n').autocomplete=m?'username':'name';$('#go').textContent=m?'Login':'Continue'};
    $('#n').oninput=sync;
    $('#go').onclick=async()=>{if(isM()){const{error}=await db.auth.signInWithPassword({email:$('#n').value.trim(),password:$('#p').value});if(error)return alert(error.message);if(await staff()===false){await db.auth.signOut();alert('This account has no staff access')}return}

    if(!name||ph.length<10)return alert('Enter name and 10-digit number');
    const{data,error}=await db.rpc('lc_register_customer',{p_name:name,p_phone:ph});if(error)return alert(error.message);
    cust={id:data,name};localStorage.lc=JSON.stringify(cust);book()}}
    const saved=()=>{try{return JSON.parse(localStorage.lcb||'null')}catch(e){return null}};
    const keep=b=>{try{b?localStorage.lcb=JSON.stringify(b):localStorage.removeItem('lcb')}catch(e){}};
    function done(b){lgb(1);
    app.innerHTML=`<div class="glass card done"><div class="tick">✓</div><h2>You're booked!</h2><p style="margin:8px 0 4px;font-weight:800">${fmt(b.slot)}</p><small>See you at ${SH}</small>${b.id?`<button id="chg" style="margin-top:22px">Change services</button><button class="s" id="cx" style="margin-top:12px">Cancel booking</button>`:''}<button class="s" id="again" style="margin-top:${b.id?12:22}px">Book another</button></div>`;
    $('#again').onclick=()=>{keep(null);book()};
    if(b.id){$('#chg').onclick=()=>book(true);
    $('#cx').onclick=async()=>{if(!confirm('Cancel this booking?'))return;const x=$('#cx');x.disabled=true;

    if(r.error){x.disabled=false;return alert(r.error.message)}
    keep(null);app.innerHTML=`<div class="glass card done"><div class="tick">✕</div><h2>Booking cancelled</h2><small>You can book again anytime</small><button id="again2" style="margin-top:22px">Book again</button></div>`;$('#again2').onclick=book}}}
    async function book(edit){lgb(1);sel=new Set();
    const cur=saved();if(cur&&edit!==true)return done(cur);
    if(!svcs.length)svcs=(await db.from('lc_services').select('*').eq('active',true).order('name')).data||[];
    const pre=new Set(edit===true&&cur?cur.svcs.map(String):[]);
    app.innerHTML=`<div class="hi"><h2>Hi ${esc(cust.name)}</h2><small>${edit===true?'Change your services':'Pick your services'}</small></div><div>${svcs.map(s=>`<div class="neo sv${pre.has(String(s.id))?' on':''}" tabindex="0" role="checkbox" aria-checked="${pre.has(String(s.id))}" data-id="${s.id}" data-p="${s.price}"><span class="ic">✓</span><span class="t">${esc(s.name)}<small>${s.mins} min</small></span><b>₹${s.price}</b></div>`).join('')}</div>${edit===true?'<button class="s" id="bkb" style="margin-top:14px">Back</button>':''}
    <div class="bar glass"><div><small>Total</small><b id="tt">₹0</b></div><button id="bk">${edit===true?'Update booking':'Book now'}</button></div>`;
    pre.forEach(i=>sel.add(i));
    const upd=()=>{let t=0;document.querySelectorAll('.sv.on').forEach(e=>t+=+e.dataset.p);$('#tt').textContent='₹'+t};

    document.querySelectorAll('.sv').forEach(e=>{e.onclick=()=>tog(e);e.onkeydown=k=>{if(k.key==' '||k.key=='Enter'){k.preventDefault();tog(e)}}});upd();
    if(edit===true)$('#bkb').onclick=()=>done(cur);
    $('#bk').onclick=async()=>{if(!sel.size)return alert('Select a service');const bt=$('#bk');bt.disabled=true;
    const slot=new Date(Date.now()+60000);
    const r=await db.rpc('lc_create_booking',{p_customer:cust.id,p_services:[...sel],p_slot:slot.toISOString()});
    if(r.error){bt.disabled=false;return alert(r.error.message)}
    if(edit===true&&cur&&cur.id){const c=await db.rpc('lc_cancel_booking',{p_customer:String(cust.id),p_booking:String(cur.id)});if(c.error)alert('Updated, but old booking could not be removed: '+c.error.message)}

    $('#ov').style.display='grid';const ids=new Set(),upd=()=>{let n=0;document.querySelectorAll('#ws .ch.on').forEach(e=>n+=+e.dataset.p);$('#wt').textContent='₹'+n};

    let found=null,tok=0;const info=$('#wi'),nm=$('#wn');
    const look=async()=>{const ph=$('#wp').value.replace(/\D/g,'').slice(-10),t=++tok;found=null;nm.style.display='none';
    if(ph.length<10){info.textContent='';return}

    const r=await db.from('lc_bookings').select('customer_name').like('phone','%'+ph).order('created_at',{ascending:false}).limit(1);
    if(t!=tok)return;
    const n=r.data&&r.data[0]&&r.data[0].customer_name;
    if(n&&!/^walk-in$/i.test(n)){found=n;info.style.color='#1a8f4c';info.textContent='✓ Existing customer: '+n}
    else{info.style.color='#b26a00';info.textContent='New customer — enter name';nm.style.display='';nm.focus()}};
    $('#wp').oninput=look;
    $('#wgo').onclick=async()=>{const d=$('#wp').value.replace(/\D/g,'').slice(-10);if(d.length<10)return alert('Enter customer 10-digit WhatsApp number');
    const name=found||nm.value.trim();if(!name)return alert('Enter customer name');
    if(!ids.size)return alert('Select a service');
    const phone=d;
    const b=$('#wgo');b.disabled=true;
    const c=await db.rpc('lc_register_customer',{p_name:name,p_phone:phone});if(c.error){b.disabled=false;return alert(c.error.message)}
    const r=await db.rpc('lc_create_booking',{p_customer:c.data,p_services:[...ids],p_slot:new Date(Date.now()+60000).toISOString()});
    if(r.error){b.disabled=false;return alert(r.error.message)}
    if(typeof r.data=='string'||typeof r.data=='number'){await loadMe();await setB(r.data,{status:'in_progress'},true)}
    $('#ov').style.display='none';staff()}}
    async function staff(){const au=(await db.auth.getUser()).data.user;if(!au)return false;const pf=await db.from('lc_profiles').select('role').eq('id',au.id).maybeSingle();if(pf.error||!pf.data||!['staff','admin'].includes(pf.data.role))return false;const t0=new Date();t0.setHours(0,0,0,0);const t1=new Date(t0);t1.setDate(t1.getDate()+1);
    const r0=await db.from('lc_bookings').select('*').gte('slot',t0.toISOString()).lt('slot',t1.toISOString()).neq('status','cancelled');
    const error=r0.error,data=r0.data;
    if(error||!data)return false;
    data.sort((x,y)=>new Date(y.created_at||y.slot)-new Date(x.created_at||x.slot));
    lgb(1);await loadMe();
    for(let i=data.length-1;i>=0;i--){const x=data[i];if(x.paid&&String(x.staff_name||'').toLowerCase()!==String(me||'').toLowerCase())data.splice(i,1)}
    app.innerHTML=`<div class="hi"><h2>Bookings</h2></div><button id="wk">＋ Add customer</button>`+(data.length?'':'<div class="neo bk"><p>No bookings today yet. New ones show up here live.</p></div>')+data.map(b=>`<div class="neo bk"><div class="row"><b style="font-size:18px">${esc(b.customer_name)}</b><span class="pill ${b.paid?'ok':''}">${b.paid?'Paid':esc(b.status)}</span></div><p>${isW(b.phone)?'Walk-in':`<a href="tel:${esc(b.phone)}">${esc(b.phone)}</a>`}</p><p>${esc(b.service_names)}</p><p>${fmt(b.slot)}</p>${b.staff_name?`<p class="by">Handled by <b>${esc(b.staff_name)}</b></p>`:''}<div class="amt">₹${b.total}</div>${b.paid?'':`<button data-q="${b.id}" data-a="${b.total}">Show QR</button><button class="s" data-p="${b.id}">Mark paid</button>`}${b.status=='booked'&&!b.paid?`<button class="s" data-s="${b.id}">Start work</button>`:''}</div>`).join('')+`<button class="s" id="lo">Logout</button>`;
    app.onclick=async e=>{const d=e.target.dataset;
    if(d.q){const q=qrcode(0,'M');q.addData(`upi://pay?pa=${UPI}&pn=${encodeURIComponent(SH)}&am=${d.a}&cu=INR`);q.make();$('#qb').innerHTML=`<h2 style="margin-bottom:14px">Pay ₹${d.a}</h2>${q.createImgTag(8)}<button class="s" id="x">Close</button>`;$('#ov').style.display='grid';$('#x').onclick=()=>$('#ov').style.display='none'}
    if(d.p){const b=data.find(x=>String(x.id)==d.p),w=b&&!isW(b.phone)?window.open('','_blank'):null;
    const r=await setB(d.p,{paid:true,status:'done'},!(b&&b.staff_name));
    if(r.error){if(w)w.close();alert(r.error.message)}else if(w){const u=waBill(b);try{w.location.href=u}catch(x){location.href=u}}
    staff()}
    if(d.s){const b=data.find(x=>String(x.id)==d.s);await setB(d.s,{status:'in_progress'},!(b&&b.staff_name));staff()}
    if(e.target.id=='wk')walkin();
    if(e.target.id=='lo'){await db.auth.signOut();init()}};
    if(!window.ch)window.ch=db.channel('b').on('postgres_changes',{event:'*',schema:'public',table:'lc_bookings'},()=>{if(app.querySelector('#lo'))staff()}).subscribe()}
        init();
    </script>
